[workspace]
members = [
    "crates/pinset",
    "crates/pinset-core",
    "crates/pinset-engine",
    "crates/pinset-env",
    "crates/pinset-shim",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "3.1.0"
authors = ["Future Element"]

[workspace.dependencies]
atomic-write-file = "0.3"
age = "0.12.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
hex = "0.4"
md5 = "0.8"
keyring-core = "1.0.0"
fs4 = "1.1.0"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
pgp = { version = "0.19.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "brotli", "gzip", "rustls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
secrecy = "0.10.3"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
url = "2.5"
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
zeroize = "1"
lzma-rust2 = { version = "0.20.1", default-features = false, features = ["std", "xz", "encoder"] }

# Upstream replaces the retired basic-toml parser with maintained toml. Remove
# this pinned patch once the next i18n-config release includes that change.
[patch.crates-io]
i18n-config = { git = "https://github.com/kellpossible/cargo-i18n", rev = "2ce7b1dfe9a8cc224288bf50cbc2a67a6de863c4" }

# Real SDK acceptance uses debug CLI binaries; keep bulk hashing and pure-Rust
# XZ decoding fast without changing application debug assertions or tests.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.lzma-rust2]
opt-level = 3
