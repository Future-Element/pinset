name: Setup Pinset
description: Install Pinset 3, install the project's exact lock, and expose managed commands on PATH.
author: Future Element
inputs:
  version:
    description: Exact Pinset 3 release version
    required: false
    default: 3.0.0
  install:
    description: Install artifacts from .pinset/lock.toml
    required: false
    default: "true"
  working-directory:
    description: Project directory or a directory inside its Pinset project boundary
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install Pinset on Unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        PINSET_VERSION: ${{ inputs.version }}
        PINSET_INSTALL_DIR: ${{ runner.temp }}/pinset-v3/bin
      run: |
        set -euo pipefail
        [[ "$PINSET_VERSION" =~ ^3\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo 'An exact Pinset 3 release is required' >&2; exit 1; }
        bash "${GITHUB_ACTION_PATH}/install.sh" --version "$PINSET_VERSION" --install-dir "$PINSET_INSTALL_DIR"
        printf '%s\n' "${PINSET_HOME:-$HOME/.pinset}/v3/bin" >> "$GITHUB_PATH"
        printf '%s\n' "$PINSET_INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Install Pinset on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PINSET_VERSION: ${{ inputs.version }}
        PINSET_INSTALL_DIR: ${{ runner.temp }}/pinset-v3/bin
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:PINSET_VERSION -notmatch '^3\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?$') { throw 'An exact Pinset 3 release is required' }
        & (Join-Path $env:GITHUB_ACTION_PATH 'install.ps1') -Version $env:PINSET_VERSION -InstallDir $env:PINSET_INSTALL_DIR
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $base = if ($env:PINSET_HOME) { $env:PINSET_HOME } else { Join-Path $env:USERPROFILE '.pinset' }
        Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $base 'v3/bin')
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:PINSET_INSTALL_DIR
    - name: Install locked project artifacts
      if: inputs.install == 'true'
      shell: bash
      env:
        PINSET_PROJECT_DIRECTORY: ${{ inputs.working-directory }}
      run: pinset -C "$PINSET_PROJECT_DIRECTORY" install
