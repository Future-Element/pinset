name: Publish VS Code extension

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate extension tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_NAME}" != "vscode-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version ${version}" >&2
            exit 1
          fi

      - name: Type-check, test, and package
        run: npm run package

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "Repository secret VSCE_PAT is required" >&2
            exit 1
          fi
          npm exec -- vsce publish --packagePath dist/pinset-vscode.vsix --pat "${VSCE_PAT}"
