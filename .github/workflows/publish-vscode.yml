name: Publish VS Code extension

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate extension tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_NAME}" != "vscode-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version ${version}" >&2
            exit 1
          fi

      - name: Type-check, test, and package
        run: npm run package

      - name: Log in with Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish extension
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npm exec -- vsce publish --packagePath dist/pinset-vscode.vsix --azure-credential
