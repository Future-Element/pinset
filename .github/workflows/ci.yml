name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Rust toolchain
        run: |
          rustup set profile minimal
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Test curl installer without network or runtime installation
        run: sh scripts/tests/install_sh_test.sh

      - name: Test full uninstaller in an isolated home
        run: sh scripts/tests/uninstall_sh_test.sh

      - name: Keep the shim dependency graph lightweight
        shell: bash
        run: |
          cargo tree -p pinset-shim -e normal > shim-dependencies.txt
          if grep -E 'reqwest|rustls|tar v|xz2|zip v|tempfile' shim-dependencies.txt; then
            echo "pinset-shim unexpectedly includes download or archive dependencies" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: pinset-linux-x86_64
            archive: pinset-linux-x86_64.tar.gz
          - os: windows-2025
            artifact: pinset-windows-x86_64
            archive: pinset-windows-x86_64.zip
          - os: macos-15
            artifact: pinset-macos-aarch64
            archive: pinset-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup update stable
          rustup default stable

      - name: Build release binaries
        run: cargo build --release --locked -p pinset-cli -p pinset-shim

      - name: Run real Node, pnpm, Bun and Go acceptance on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          PINSET_BIN: ${{ github.workspace }}/target/release/pinset
          PINSET_GLOBAL_VERSION: 24.0.0
          PINSET_PROJECT_VERSION: 22.0.0
          PINSET_GLOBAL_PNPM_SELECTOR: latest
          PINSET_PROJECT_PNPM_SELECTOR: 10
          PINSET_PROJECT_BUN_SELECTOR: 1.2
          PINSET_BUN_VERSION: 1.3.14
          PINSET_GLOBAL_FLUTTER_SELECTOR: latest
          PINSET_PROJECT_FLUTTER_SELECTOR: 3.44
          PINSET_SKIP_FLUTTER_RUNTIME: 1
        run: bash scripts/tests/ubuntu_runtime_acceptance.sh

      - name: Run real Node, pnpm, Bun and Go acceptance on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PINSET_BIN: ${{ github.workspace }}\target\release\pinset.exe
          PINSET_GLOBAL_VERSION: 24.0.0
          PINSET_PROJECT_VERSION: 22.0.0
          PINSET_GLOBAL_PNPM_SELECTOR: latest
          PINSET_PROJECT_PNPM_SELECTOR: 10
          PINSET_PROJECT_BUN_SELECTOR: 1.2
          PINSET_BUN_VERSION: 1.3.14
          PINSET_GLOBAL_FLUTTER_SELECTOR: latest
          PINSET_PROJECT_FLUTTER_SELECTOR: 3.44
          PINSET_SKIP_FLUTTER_RUNTIME: 1
        run: ./scripts/tests/windows_runtime_acceptance.ps1

      - name: Test Unix curl installer
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/tests/install_sh_test.sh

      - name: Test Unix full uninstaller
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/tests/uninstall_sh_test.sh

      - name: Test Windows full uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/uninstall_ps1_test.ps1

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp target/release/pinset package/pinset
          cp target/release/pinset-shim package/pinset-shim
          tar -czf "${{ matrix.archive }}" -C package pinset pinset-shim

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/release/pinset.exe package/pinset.exe
          Copy-Item target/release/pinset-shim.exe package/pinset-shim.exe
          Compress-Archive `
            -Path package/pinset.exe,package/pinset-shim.exe `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  ubuntu-runtime-acceptance:
    name: Ubuntu real runtime acceptance
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Rust toolchain
        run: |
          rustup set profile minimal
          rustup update stable
          rustup default stable

      - name: Build locked release binaries
        run: cargo build --release --locked -p pinset-cli -p pinset-shim

      - name: Run real Node, pnpm, Bun and Go acceptance in an isolated home
        env:
          PINSET_BIN: ${{ github.workspace }}/target/release/pinset
          PINSET_GLOBAL_VERSION: 24.0.0
          PINSET_PROJECT_VERSION: 22.0.0
          PINSET_GLOBAL_FLUTTER_SELECTOR: latest
          PINSET_PROJECT_FLUTTER_SELECTOR: 3.44
          PINSET_SKIP_FLUTTER_RUNTIME: 1
        run: bash scripts/tests/ubuntu_runtime_acceptance.sh
