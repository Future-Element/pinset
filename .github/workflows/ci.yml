name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      validation_required: ${{ steps.classify.outputs.validation_required }}
      code_changed: ${{ steps.classify.outputs.code_changed }}
      cargo_changed: ${{ steps.classify.outputs.cargo_changed }}
      extension_changed: ${{ steps.classify.outputs.extension_changed }}
      website_changed: ${{ steps.classify.outputs.website_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify the event and changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          validation_required=true
          code_changed=true
          cargo_changed=true
          extension_changed=true
          website_changed=true

          if [[ "${EVENT_NAME}" == "pull_request" && "${IS_DRAFT}" == "true" ]]; then
            validation_required=false
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            merged_prs="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length'
            )"
            successful_manual_runs="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=workflow_dispatch&status=success&head_sha=${HEAD_SHA}&per_page=1" \
                --jq '.total_count'
            )"
            if [[ "${merged_prs}" -gt 0 || "${successful_manual_runs}" -gt 0 ]]; then
              validation_required=false
            fi
          fi

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            code_changed=false
            cargo_changed=true
            extension_changed=false
            website_changed=false
          elif [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
              changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
            else
              changed_files="$(git diff-tree --root --no-commit-id --name-only -r "${HEAD_SHA}")"
            fi

            code_changed=false
            cargo_changed=false
            extension_changed=false
            website_changed=false
            while IFS= read -r changed_file; do
              [[ -z "${changed_file}" ]] && continue

              case "${changed_file}" in
                *.md|docs/*|website/*|.github/FUNDING.yml|.github/ISSUE_TEMPLATE/*)
                  ;;
                *)
                  code_changed=true
                  ;;
              esac

              case "${changed_file}" in
                Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/*/Cargo.toml)
                  cargo_changed=true
                  ;;
              esac

              case "${changed_file}" in
                editors/vscode/*|.github/workflows/ci.yml|.github/workflows/release-preflight.yml|.github/workflows/release.yml)
                  extension_changed=true
                  ;;
              esac

              case "${changed_file}" in
                website/*|docs/commands.md|docs/commands.zh-CN.md|.github/workflows/ci.yml|.github/workflows/release-preflight.yml|.github/workflows/release.yml)
                  website_changed=true
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          {
            echo "validation_required=${validation_required}"
            echo "code_changed=${code_changed}"
            echo "cargo_changed=${cargo_changed}"
            echo "extension_changed=${extension_changed}"
            echo "website_changed=${website_changed}"
          } >> "${GITHUB_OUTPUT}"

          echo "validation_required=${validation_required}"
          echo "code_changed=${code_changed}"
          echo "cargo_changed=${cargo_changed}"
          echo "extension_changed=${extension_changed}"
          echo "website_changed=${website_changed}"

  security:
    name: Audit Rust dependencies
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.validation_required == 'true' &&
        needs.changes.outputs.cargo_changed == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Restore pinned RustSec audit tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install pinned RustSec audit tool when absent
        shell: bash
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked

      - name: Reject dependency security warnings
        # RUSTSEC-2023-0071 affects observable timing of RSA private-key operations. Pinset only
        # parses public Node.js release certificates and verifies signatures; it never decrypts or
        # stores OpenPGP private keys. The advisory has no patched version as of this release.
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

  quality:
    name: Validate Rust workspace
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.validation_required == 'true' &&
        needs.changes.outputs.code_changed == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke test the local composite action
        uses: ./
        with:
          version: 1.8.0
          install: "false"

      - name: Verify the action-installed CLI
        shell: bash
        run: pinset --version | grep -F "pinset 1.8.0"

      - name: Prepare pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Prepare formatting fix for contributors
        if: steps.formatting.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff --binary > formatting.patch

      - name: Upload formatting fix
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatting-fix
          path: formatting.patch
          retention-days: 3

      - name: Run Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        id: tests
        continue-on-error: true
        run: cargo test --workspace --all-features --locked

      - name: Validate integration contracts
        id: integrations
        continue-on-error: true
        run: python3 scripts/tests/integrations_test.py

      - name: Enforce all workspace checks
        if: always()
        shell: bash
        env:
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          FORMATTING_OUTCOME: ${{ steps.formatting.outcome }}
          INTEGRATIONS_OUTCOME: ${{ steps.integrations.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          failed=0
          for result in \
            "formatting=${FORMATTING_OUTCOME}" \
            "clippy=${CLIPPY_OUTCOME}" \
            "tests=${TESTS_OUTCOME}" \
            "integrations=${INTEGRATIONS_OUTCOME}"; do
            if [[ "${result#*=}" != "success" ]]; then
              echo "${result%%=*} failed" >&2
              failed=1
            fi
          done
          exit "${failed}"

  build:
    name: Build ${{ matrix.artifact }}
    needs:
      - changes
      - security
      - quality
    if: >-
      ${{
        always() &&
        needs.changes.outputs.validation_required == 'true' &&
        needs.changes.outputs.code_changed == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: pinset-linux-x86_64
          - os: windows-2025
            artifact: pinset-windows-x86_64
          - os: macos-15
            artifact: pinset-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Propagate prerequisite failures
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [[ "${QUALITY_RESULT}" != "success" ]]; then
            echo "Validate Rust workspace did not succeed: ${QUALITY_RESULT}" >&2
            exit 1
          fi
          if [[ "${SECURITY_RESULT}" != "success" && "${SECURITY_RESULT}" != "skipped" ]]; then
            echo "Audit Rust dependencies did not succeed: ${SECURITY_RESULT}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Link development binaries
        run: cargo build --locked -p pinset-cli -p pinset-shim

      - name: Prepare native terminal and credential-store acceptance
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python -m pip install --only-binary=:all: pywinpty==3.0.5
          elif [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y gnome-keyring dbus-x11
          fi

      - name: Validate native execution and local environments
        shell: bash
        run: |
          cargo test --locked -p pinset-cli --test short_execution_cli --test python_cli
          cargo test --locked -p pinset-shim
          suffix=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then suffix=".exe"; fi
          PINSET_TEST_SHIM="${GITHUB_WORKSPACE}/target/debug/pinset-shim${suffix}" \
            cargo test --locked -p pinset-cli --test short_execution_cli paired_shim_uses -- --ignored
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            dbus-run-session -- sh -c 'printf "%s" "disposable-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets; python3 scripts/tests/environment_wizard_test.py target/debug/pinset --keyring'
          else
            python scripts/tests/environment_wizard_test.py "target/debug/pinset${suffix}" --keyring
          fi

  website:
    name: Validate documentation website
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.validation_required == 'true' &&
        needs.changes.outputs.website_changed == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SITE_URL: https://pinset.future-element.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install locked website dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check website
        run: pnpm typecheck

      - name: Build production website
        run: pnpm build

      - name: Validate site-name and canonical SEO signals
        run: pnpm validate:seo

      - name: Reject development origins in static output
        shell: bash
        run: if grep -R --exclude='404.html' --exclude='_not-found*' --exclude-dir='_not-found' "http://localhost:3000" out; then exit 1; fi

  extension:
    name: Validate VS Code extension
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.validation_required == 'true' &&
        needs.changes.outputs.extension_changed == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked extension dependencies
        run: npm ci

      - name: Type-check, test, and package extension
        run: npm run package

      - name: Inspect packaged files
        shell: bash
        run: |
          unzip -l dist/pinset-vscode.vsix > vsix-files.txt
          grep -F 'extension/dist/extension.js' vsix-files.txt
          if grep -E 'extension/(src|test|node_modules)/' vsix-files.txt; then
            echo "VSIX contains development files" >&2
            exit 1
          fi

  gate:
    name: CI Gate
    needs:
      - changes
      - security
      - quality
      - build
      - extension
      - website
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the aggregate result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          EXTENSION_CHANGED: ${{ needs.changes.outputs.extension_changed }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WEBSITE_CHANGED: ${{ needs.changes.outputs.website_changed }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          VALIDATION_REQUIRED: ${{ needs.changes.outputs.validation_required }}
        run: |
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "Change classification failed" >&2
            exit 1
          fi
          if [[ "${VALIDATION_REQUIRED}" != "true" ]]; then
            echo "Heavy validation is not required for this event"
            exit 0
          fi
          if [[ "${SECURITY_RESULT}" != "success" && "${SECURITY_RESULT}" != "skipped" ]]; then
            echo "Dependency audit failed: ${SECURITY_RESULT}" >&2
            exit 1
          fi
          if [[ "${WEBSITE_CHANGED}" == "true" && "${WEBSITE_RESULT}" != "success" ]]; then
            echo "Documentation website validation failed: ${WEBSITE_RESULT}" >&2
            exit 1
          fi
          if [[ "${EXTENSION_CHANGED}" == "true" && "${EXTENSION_RESULT}" != "success" ]]; then
            echo "VS Code extension validation failed: ${EXTENSION_RESULT}" >&2
            exit 1
          fi
          if [[ "${CODE_CHANGED}" != "true" ]]; then
            echo "No code validation required; dependency audit result accepted"
            exit 0
          fi
          if [[ "${QUALITY_RESULT}" != "success" ]]; then
            echo "Workspace validation failed: ${QUALITY_RESULT}" >&2
            exit 1
          fi
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Cross-platform builds failed: ${BUILD_RESULT}" >&2
            exit 1
          fi
          echo "All required CI checks passed"
