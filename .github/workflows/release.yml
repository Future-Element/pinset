name: Publish Pinset 3
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v3 tag matching the clean local all report
        required: true
      local-report:
        description: Exact compact JSON from local Docker verify.ps1 -Suite all
        required: true
      report-sha256:
        description: SHA-256 of the exact local report JSON
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate release inputs and local report metadata
        env:
          PINSET_RELEASE_TAG: ${{ inputs.tag }}
          PINSET_LOCAL_REPORT: ${{ inputs.local-report }}
          PINSET_LOCAL_REPORT_SHA256: ${{ inputs.report-sha256 }}
        run: python3 scripts/release_gate.py
  binaries:
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: windows-2025
            target: windows-x86_64
          - os: macos-15
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    env:
      PINSET_RELEASE_VERSION: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - name: Compile Linux release binaries on the pinned Debian baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build --file scripts/docker/Dockerfile.release --tag pinset-release .
          docker run --rm --env PINSET_RELEASE_VERSION --volume "${PWD}:/workspace" pinset-release
      - name: Compile native Windows and macOS release binaries
        if: runner.os != 'Linux'
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --release --locked -p pinset-cli -p pinset-shim
      - name: Package compiled artifacts and dependency inventory
        env:
          PINSET_RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinset-${{ matrix.target }}
          path: dist/*
  extension:
    needs: inputs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Compile and package extension
        run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinset-extension
          path: editors/vscode/dist/pinset-vscode.vsix
  publish:
    needs: [inputs, binaries, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums and preserve local verification evidence
        env:
          PINSET_LOCAL_REPORT: ${{ inputs.local-report }}
        run: |
          printf '%s' "$PINSET_LOCAL_REPORT" > dist/local-verification.json
          cd dist
          sha256sum -- *.zip *.vsix *.sbom.json local-verification.json > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*
      - name: Upload complete release assets to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft --latest=false "${prerelease[@]}"
      - name: Check uploaded draft asset completeness
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/check_release_assets.py
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          latest=true
          if [[ "$RELEASE_TAG" == *-* ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
