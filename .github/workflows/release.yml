name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and workspace version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workspace_version="$(
            python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])'
          )"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "${release_version}" != "${workspace_version}" && "${release_version}" != "${workspace_version}-rc.1" ]]; then
            echo "release tag ${GITHUB_REF_NAME} must match v${workspace_version} or v${workspace_version}-rc.1" >&2
            exit 1
          fi
          if [[ "${release_version}" == "2.0.0" ]] && ! gh release view v2.0.0-rc.1 >/dev/null 2>&1; then
            echo "v2.0.0 requires the published v2.0.0-rc.1 acceptance release" >&2
            exit 1
          fi
          installer_version="$(sed -n 's/^DEFAULT_VERSION="\([^"]*\)"$/\1/p' install.sh)"
          if [[ "${installer_version}" != "${workspace_version}" ]]; then
            echo "install.sh default ${installer_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          windows_installer_version="$(python3 -c 'import pathlib; lines=pathlib.Path("install.ps1").read_text().splitlines(); line=next((line for line in lines if "[string] $Version = " in line), ""); print(line.split(chr(39))[1] if line.count(chr(39)) >= 2 else "")')"
          if [[ "${windows_installer_version}" != "${workspace_version}" ]]; then
            echo "install.ps1 default ${windows_installer_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          action_version="$(awk '/^  version:/{seen=1} seen && /^    default:/{print $2; exit}' action.yml)"
          if [[ "${action_version}" != "${workspace_version}" ]]; then
            echo "action.yml default ${action_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi

      - name: Require a recent successful release preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          preflight_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-preflight.yml/runs?event=workflow_dispatch&status=success&head_sha=${release_commit}&per_page=10"
          )"
          preflight_created="$(
            jq -r \
              --arg commit "${release_commit}" \
              '[.workflow_runs[] | select(.head_sha == $commit and .head_branch == "main")] | .[0].created_at // empty' \
              <<< "${preflight_json}"
          )"
          if [[ -z "${preflight_created}" ]]; then
            echo "No successful Release preflight exists for main commit ${release_commit}" >&2
            exit 1
          fi

          PREFLIGHT_CREATED="${preflight_created}" python3 - <<'PY'
          import datetime
          import os

          created = datetime.datetime.fromisoformat(
              os.environ["PREFLIGHT_CREATED"].replace("Z", "+00:00")
          )
          age = datetime.datetime.now(datetime.timezone.utc) - created
          if age < datetime.timedelta(0) or age > datetime.timedelta(hours=24):
              raise SystemExit(
                  f"Release preflight is {age} old; run it again on main before tagging"
              )
          print(f"Using Release preflight from {created.isoformat()}")
          PY

      - name: Prepare pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Restore pinned CycloneDX tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: ${{ runner.os }}-cargo-cyclonedx-0.5.9

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --all --all-features --target all
          mkdir sbom
          cp crates/pinset/pinset-cli.cdx.json sbom/pinset-cli.cdx.json
          cp crates/pinset-core/pinset-core.cdx.json sbom/pinset-core.cdx.json
          cp crates/pinset-env/pinset-env.cdx.json sbom/pinset-env.cdx.json
          cp crates/pinset-shim/pinset-shim.cdx.json sbom/pinset-shim.cdx.json
          for document in sbom/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and (.specVersion | length > 0)' "$document" >/dev/null
          done

      - name: Upload release SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinset-sboms
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.artifact }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: pinset-linux-x86_64
            archive: pinset-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            artifact: pinset-linux-aarch64
            archive: pinset-linux-aarch64.tar.gz
          - os: windows-2025
            artifact: pinset-windows-x86_64
            archive: pinset-windows-x86_64.zip
          - os: macos-15
            artifact: pinset-macos-aarch64
            archive: pinset-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Build release binaries
        run: cargo build --release --locked -p pinset-cli -p pinset-shim

      - name: Verify macOS release dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          sh scripts/tests/macos_release_dependencies.sh
          target/release/pinset
          target/release/pinset-shim

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp target/release/pinset package/pinset
          cp target/release/pinset-shim package/pinset-shim
          tar -czf "${{ matrix.archive }}" -C package pinset pinset-shim

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/release/pinset.exe package/pinset.exe
          Copy-Item target/release/pinset-shim.exe package/pinset-shim.exe
          Compress-Archive `
            -Path package/pinset.exe,package/pinset-shim.exe `
            -DestinationPath "${{ matrix.archive }}"

      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "${release_version}" == *-* ]]; then
            sed -i "s/^DEFAULT_VERSION=\"[^\"]*\"$/DEFAULT_VERSION=\"${release_version}\"/" dist/install.sh
            RELEASE_VERSION="${release_version}" python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("dist/install.ps1")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"^    \[string\] \$Version = '[^']*'",
              f"    [string] $Version = '{os.environ['RELEASE_VERSION']}'",
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("install.ps1 version declaration was not found exactly once")
          path.write_text(updated, encoding="utf-8")
          PY
          fi
          cp uninstall.sh dist/uninstall.sh
          cp uninstall.ps1 dist/uninstall.ps1
          chmod 755 dist/install.sh dist/uninstall.sh
          (
            cd dist
            sha256sum \
              install.sh \
              install.ps1 \
              uninstall.sh \
              uninstall.ps1 \
              pinset-linux-x86_64.tar.gz \
              pinset-linux-aarch64.tar.gz \
              pinset-macos-aarch64.tar.gz \
              pinset-windows-x86_64.zip \
              pinset-cli.cdx.json \
              pinset-core.cdx.json \
              pinset-env.cdx.json \
              pinset-shim.cdx.json \
              > SHA256SUMS
          )

      - name: Generate package-manager manifests
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          python3 scripts/generate_package_manifests.py \
            --version "${release_version}" \
            --checksums dist/SHA256SUMS \
            --output dist
          (
            cd dist
            sha256sum pinset-winget.yaml pinset-scoop.json pinset.rb >> SHA256SUMS
          )

      - name: Attest release metadata provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/install.sh
            dist/install.ps1
            dist/uninstall.sh
            dist/uninstall.ps1
            dist/SHA256SUMS
            dist/pinset-cli.cdx.json
            dist/pinset-core.cdx.json
            dist/pinset-env.cdx.json
            dist/pinset-shim.cdx.json
            dist/pinset-winget.yaml
            dist/pinset-scoop.json
            dist/pinset.rb

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/install.sh
            dist/install.ps1
            dist/uninstall.sh
            dist/uninstall.ps1
            dist/pinset-linux-x86_64.tar.gz
            dist/pinset-linux-aarch64.tar.gz
            dist/pinset-macos-aarch64.tar.gz
            dist/pinset-windows-x86_64.zip
            dist/pinset-cli.cdx.json
            dist/pinset-core.cdx.json
            dist/pinset-env.cdx.json
            dist/pinset-shim.cdx.json
            dist/pinset-winget.yaml
            dist/pinset-scoop.json
            dist/pinset.rb
            dist/SHA256SUMS
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            exit 0
          fi

          release_flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Pinset ${GITHUB_REF_NAME#v}" \
            "${release_flags[@]}"
