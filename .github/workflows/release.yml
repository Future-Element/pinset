name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and workspace version
        shell: bash
        run: |
          workspace_version="$(
            python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])'
          )"
          release_version="${GITHUB_REF_NAME#v}"
          valid_release=0
          if [[ "${release_version}" == "${workspace_version}" ]]; then
            valid_release=1
          elif [[ "${release_version}" == "${workspace_version}-rc."* ]]; then
            rc_number="${release_version#"${workspace_version}-rc."}"
            if [[ "${rc_number}" =~ ^[0-9]+$ ]]; then
              valid_release=1
            fi
          fi
          if [[ "${valid_release}" != "1" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match workspace version v${workspace_version} or an rc tag" >&2
            exit 1
          fi
          installer_version="$(sed -n 's/^DEFAULT_VERSION="\([^"]*\)"$/\1/p' install.sh)"
          if [[ "${installer_version}" != "${workspace_version}" ]]; then
            echo "install.sh default ${installer_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi

      - name: Prepare Rust toolchain
        run: |
          rustup set profile minimal
          rustup update 1.88.0
          rustup default 1.88.0
          rustup component add clippy rustfmt

      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Reject dependency security warnings
        # RUSTSEC-2023-0071 affects observable timing of RSA private-key operations. Pinset only
        # parses public Node.js release certificates and verifies signatures; it never decrypts or
        # stores OpenPGP private keys. The advisory has no patched version as of this release.
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Test curl installer without network or runtime installation
        run: sh scripts/tests/install_sh_test.sh

      - name: Test full uninstaller in an isolated home
        run: sh scripts/tests/uninstall_sh_test.sh

      - name: Keep the shim dependency graph lightweight
        shell: bash
        run: |
          cargo tree -p pinset-shim -e normal --locked > shim-dependencies.txt
          if grep -E 'reqwest|rustls|tar v|xz2|zip v|tempfile' shim-dependencies.txt; then
            echo "pinset-shim unexpectedly includes download or archive dependencies" >&2
            exit 1
          fi

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --all --all-features --target all
          mkdir sbom
          cp crates/pinset/pinset-cli.cdx.json sbom/pinset-cli.cdx.json
          cp crates/pinset-core/pinset-core.cdx.json sbom/pinset-core.cdx.json
          cp crates/pinset-shim/pinset-shim.cdx.json sbom/pinset-shim.cdx.json
          for document in sbom/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and (.specVersion | length > 0)' "$document" >/dev/null
          done

      - name: Upload release SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinset-sboms
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.artifact }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: pinset-linux-x86_64
            archive: pinset-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            artifact: pinset-linux-aarch64
            archive: pinset-linux-aarch64.tar.gz
          - os: windows-2025
            artifact: pinset-windows-x86_64
            archive: pinset-windows-x86_64.zip
          - os: macos-15
            artifact: pinset-macos-aarch64
            archive: pinset-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup update 1.88.0
          rustup default 1.88.0

      - name: Build release binaries
        run: cargo build --release --locked -p pinset-cli -p pinset-shim

      - name: Verify macOS release dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          sh scripts/tests/macos_release_dependencies.sh
          target/release/pinset
          target/release/pinset-shim

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp target/release/pinset package/pinset
          cp target/release/pinset-shim package/pinset-shim
          tar -czf "${{ matrix.archive }}" -C package pinset pinset-shim

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/release/pinset.exe package/pinset.exe
          Copy-Item target/release/pinset-shim.exe package/pinset-shim.exe
          Compress-Archive `
            -Path package/pinset.exe,package/pinset-shim.exe `
            -DestinationPath "${{ matrix.archive }}"

      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - quality
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cp install.sh dist/install.sh
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "${release_version}" == *-* ]]; then
            sed -i "s/^DEFAULT_VERSION=\"[^\"]*\"$/DEFAULT_VERSION=\"${release_version}\"/" dist/install.sh
          fi
          cp uninstall.sh dist/uninstall.sh
          cp uninstall.ps1 dist/uninstall.ps1
          chmod 755 dist/install.sh dist/uninstall.sh
          (
            cd dist
            sha256sum \
              install.sh \
              uninstall.sh \
              uninstall.ps1 \
              pinset-linux-x86_64.tar.gz \
              pinset-linux-aarch64.tar.gz \
              pinset-macos-aarch64.tar.gz \
              pinset-windows-x86_64.zip \
              pinset-cli.cdx.json \
              pinset-core.cdx.json \
              pinset-shim.cdx.json \
              > SHA256SUMS
          )

      - name: Attest release metadata provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/install.sh
            dist/uninstall.sh
            dist/uninstall.ps1
            dist/SHA256SUMS
            dist/pinset-cli.cdx.json
            dist/pinset-core.cdx.json
            dist/pinset-shim.cdx.json

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/install.sh
            dist/uninstall.sh
            dist/uninstall.ps1
            dist/pinset-linux-x86_64.tar.gz
            dist/pinset-linux-aarch64.tar.gz
            dist/pinset-macos-aarch64.tar.gz
            dist/pinset-windows-x86_64.zip
            dist/pinset-cli.cdx.json
            dist/pinset-core.cdx.json
            dist/pinset-shim.cdx.json
            dist/SHA256SUMS
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            exit 0
          fi

          release_flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Pinset ${GITHUB_REF_NAME#v}" \
            "${release_flags[@]}"
