name: Release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release candidate
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workspace release metadata
        shell: bash
        run: |
          workspace_version="$(
            python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])'
          )"
          python3 scripts/validate_release_version.py "${workspace_version}" "v${workspace_version}-rc.10"
          installer_version="$(sed -n 's/^DEFAULT_VERSION="\([^"]*\)"$/\1/p' install.sh)"
          if [[ "${installer_version}" != "${workspace_version}" ]]; then
            echo "install.sh default ${installer_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          windows_installer_version="$(python3 -c 'import pathlib; lines=pathlib.Path("install.ps1").read_text().splitlines(); line=next((line for line in lines if "[string] $Version = " in line), ""); print(line.split(chr(39))[1] if line.count(chr(39)) >= 2 else "")')"
          if [[ "${windows_installer_version}" != "${workspace_version}" ]]; then
            echo "install.ps1 default ${windows_installer_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          action_version="$(awk '/^  version:/{seen=1} seen && /^    default:/{print $2; exit}' action.yml)"
          if [[ "${action_version}" != "${workspace_version}" ]]; then
            echo "action.yml default ${action_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          website_version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("website/package.json").read_text())["version"])')"
          if [[ "${website_version}" != "${workspace_version}" ]]; then
            echo "website/package.json version ${website_version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          extension_version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("editors/vscode/package.json").read_text())["version"])')"
          if [[ "${extension_version}" != "1.0.0" ]]; then
            echo "VS Code extension version ${extension_version} does not match the 2.11 release contract" >&2
            exit 1
          fi
          if ! grep -F "## ${workspace_version} " CHANGELOG.md >/dev/null; then
            echo "CHANGELOG.md does not contain a ${workspace_version} release heading" >&2
            exit 1
          fi

      - name: Prepare pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Restore pinned RustSec audit tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install pinned RustSec audit tool when absent
        shell: bash
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked

      - name: Reject dependency security warnings
        id: audit
        continue-on-error: true
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        id: tests
        continue-on-error: true
        run: cargo test --workspace --all-features --locked

      - name: Validate integration contracts
        id: integrations
        continue-on-error: true
        run: python3 scripts/tests/integrations_test.py

      - name: Test curl installer without network or runtime installation
        id: installer
        continue-on-error: true
        run: sh scripts/tests/install_sh_test.sh

      - name: Test full uninstaller in an isolated home
        id: uninstaller
        continue-on-error: true
        run: sh scripts/tests/uninstall_sh_test.sh

      - name: Keep the shim dependency graph lightweight
        id: shim_dependencies
        continue-on-error: true
        shell: bash
        run: |
          cargo tree -p pinset-shim -e normal --locked > shim-dependencies.txt
          if grep -E 'reqwest|rustls|tar v|xz2|zip v|tempfile|(^| )age v|keyring' shim-dependencies.txt; then
            echo "pinset-shim unexpectedly includes download, archive, cryptography, or keyring dependencies" >&2
            exit 1
          fi

      - name: Enforce every release candidate check
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          FORMATTING_OUTCOME: ${{ steps.formatting.outcome }}
          INSTALLER_OUTCOME: ${{ steps.installer.outcome }}
          INTEGRATIONS_OUTCOME: ${{ steps.integrations.outcome }}
          SHIM_OUTCOME: ${{ steps.shim_dependencies.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          UNINSTALLER_OUTCOME: ${{ steps.uninstaller.outcome }}
        run: |
          failed=0
          for result in \
            "audit=${AUDIT_OUTCOME}" \
            "formatting=${FORMATTING_OUTCOME}" \
            "clippy=${CLIPPY_OUTCOME}" \
            "tests=${TESTS_OUTCOME}" \
            "integrations=${INTEGRATIONS_OUTCOME}" \
            "installer=${INSTALLER_OUTCOME}" \
            "uninstaller=${UNINSTALLER_OUTCOME}" \
            "shim_dependencies=${SHIM_OUTCOME}"; do
            if [[ "${result#*=}" != "success" ]]; then
              echo "${result%%=*} failed" >&2
              failed=1
            fi
          done
          exit "${failed}"

  windows_scripts:
    name: Validate Windows scripts
    if: github.ref_name == 'main'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test PowerShell uninstaller in an isolated home
        shell: pwsh
        run: ./scripts/tests/uninstall_ps1_test.ps1

      - name: Validate PowerShell installer contract
        shell: pwsh
        run: ./scripts/tests/install_ps1_test.ps1

  website:
    name: Validate release website
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SITE_URL: https://pinset.future-element.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install locked website dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check website
        run: pnpm typecheck

      - name: Build production website
        run: pnpm build

      - name: Validate site-name and canonical SEO signals
        run: pnpm validate:seo

      - name: Reject development origins in static output
        shell: bash
        run: if grep -R --exclude='404.html' --exclude='_not-found*' --exclude-dir='_not-found' "http://localhost:3000" out; then exit 1; fi

  extension:
    name: Validate release VS Code extension
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked extension dependencies
        run: npm ci

      - name: Type-check, test, and package extension
        run: npm run package

      - name: Inspect packaged files
        shell: bash
        run: |
          unzip -l dist/pinset-vscode-1.0.0.vsix > vsix-files.txt
          grep -F 'extension/dist/extension.js' vsix-files.txt
          if grep -E 'extension/(src|test|node_modules)/' vsix-files.txt; then
            echo "VSIX contains development files" >&2
            exit 1
          fi

  build:
    name: Preflight ${{ matrix.artifact }}
    if: github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: pinset-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: pinset-linux-aarch64
          - os: windows-2025
            artifact: pinset-windows-x86_64
          - os: macos-15
            artifact: pinset-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Build release binaries
        run: cargo build --release --locked -p pinset-cli -p pinset-shim

      - name: Prepare native terminal and credential-store acceptance
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python -m pip install --only-binary=:all: pywinpty==3.0.5
          elif [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y gnome-keyring dbus-x11
          fi

      - name: Validate native execution and local environments
        shell: bash
        run: |
          cargo test --release --locked -p pinset-cli --test short_execution_cli --test python_cli
          cargo test --release --locked -p pinset-shim
          suffix=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then suffix=".exe"; fi
          PINSET_TEST_SHIM="${GITHUB_WORKSPACE}/target/release/pinset-shim${suffix}" \
            cargo test --release --locked -p pinset-cli --test short_execution_cli paired_shim_uses -- --ignored
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            dbus-run-session -- sh -c 'printf "%s" "disposable-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets; python3 scripts/tests/environment_wizard_test.py target/release/pinset --keyring'
          else
            python scripts/tests/environment_wizard_test.py "target/release/pinset${suffix}" --keyring
          fi

      - name: Verify macOS release dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          sh scripts/tests/macos_release_dependencies.sh
          target/release/pinset
          target/release/pinset-shim

  gate:
    name: Release preflight gate
    needs:
      - validate
      - windows_scripts
      - build
      - extension
      - website
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the aggregate result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          REF_NAME: ${{ github.ref_name }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          WINDOWS_RESULT: ${{ needs.windows_scripts.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          if [[ "${REF_NAME}" != "main" ]]; then
            echo "Release preflight must be dispatched from main" >&2
            exit 1
          fi
          if [[ "${VALIDATE_RESULT}" != "success" ]]; then
            echo "Release candidate validation failed: ${VALIDATE_RESULT}" >&2
            exit 1
          fi
          if [[ "${WINDOWS_RESULT}" != "success" ]]; then
            echo "Windows script validation failed: ${WINDOWS_RESULT}" >&2
            exit 1
          fi
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Release candidate builds failed: ${BUILD_RESULT}" >&2
            exit 1
          fi
          if [[ "${EXTENSION_RESULT}" != "success" ]]; then
            echo "Release VS Code extension validation failed: ${EXTENSION_RESULT}" >&2
            exit 1
          fi
          if [[ "${WEBSITE_RESULT}" != "success" ]]; then
            echo "Release website validation failed: ${WEBSITE_RESULT}" >&2
            exit 1
          fi
          echo "Release candidate is ready to tag"
