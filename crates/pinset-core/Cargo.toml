[package]
name = "pinset-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
default = []
http-client = ["dep:reqwest"]
installer = [
    "dep:base64",
    "dep:flate2",
    "dep:fs4",
    "dep:hex",
    "http-client",
    "dep:sha2",
    "dep:tar",
    "dep:tempfile",
    "dep:xz2",
    "dep:zip",
]
go-metadata = ["lockfile", "sources", "http-client", "dep:serde_json"]
go-provider = ["sources"]
flutter-metadata = ["lockfile", "sources", "http-client", "dep:serde_json"]
flutter-provider = ["sources"]
java-metadata = ["lockfile", "http-client", "dep:serde_json"]
java-provider = []
rust-metadata = ["lockfile", "http-client", "dep:sha2"]
rust-provider = []
dotnet-metadata = ["lockfile", "http-client", "dep:serde_json"]
dotnet-provider = []
python-metadata = ["lockfile", "sources", "dep:md5", "http-client", "dep:serde_json", "dep:sha2", "dep:tempfile"]
python-provider = ["sources"]
lockfile = ["node-provider", "go-provider", "flutter-provider", "java-provider", "rust-provider", "dotnet-provider", "python-provider", "dep:atomic-write-file", "dep:base64", "dep:hex", "dep:sha2"]
node-metadata = ["lockfile", "dep:pgp", "http-client", "dep:serde_json"]
node-provider = ["sources"]
npm-metadata = [
    "lockfile",
    "sources",
    "dep:p256",
    "http-client",
    "dep:semver",
    "dep:serde_json",
]
environment-selection = ["dep:sha2"]
project-write = ["environment-selection", "dep:atomic-write-file", "dep:fs4", "dep:sha2", "dep:tempfile", "dep:uuid"]
project-discovery = ["dep:json5", "dep:serde_json", "dep:serde_yaml"]
provider-registry = ["dep:hex", "dep:pgp", "dep:serde_json"]
declarative-provider = ["lockfile", "provider-registry", "http-client", "dep:semver", "dep:serde_json"]
state-write = ["dep:atomic-write-file", "dep:fs4"]
sources = [
    "dep:atomic-write-file",
]

[dependencies]
atomic-write-file = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
json5 = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
fs4 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
pgp = { workspace = true, optional = true }
same-file.workspace = true
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
url.workspace = true
uuid = { workspace = true, optional = true }
xz2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
