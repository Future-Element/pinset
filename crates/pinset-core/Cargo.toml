[package]
name = "pinset-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
default = []
installer = [
    "dep:base64",
    "dep:flate2",
    "dep:fs4",
    "dep:hex",
    "dep:reqwest",
    "dep:sha2",
    "dep:tar",
    "dep:tempfile",
    "dep:xz2",
    "dep:zip",
]
go-metadata = ["lockfile", "sources", "dep:reqwest", "dep:serde_json"]
go-provider = ["sources"]
flutter-metadata = ["lockfile", "sources", "dep:reqwest", "dep:serde_json"]
flutter-provider = ["sources"]
java-metadata = ["lockfile", "dep:reqwest", "dep:serde_json", "dep:url"]
java-provider = ["dep:url"]
rust-metadata = ["lockfile", "dep:reqwest", "dep:sha2", "dep:url"]
rust-provider = ["dep:url"]
dotnet-metadata = ["lockfile", "dep:reqwest", "dep:serde_json", "dep:url"]
dotnet-provider = ["dep:url"]
python-metadata = ["lockfile", "sources", "dep:reqwest", "dep:serde_json"]
python-provider = ["sources"]
lockfile = ["node-provider", "go-provider", "flutter-provider", "java-provider", "rust-provider", "dotnet-provider", "python-provider", "dep:atomic-write-file", "dep:base64", "dep:hex"]
node-metadata = ["lockfile", "dep:reqwest", "dep:serde_json"]
node-provider = ["sources"]
npm-metadata = [
    "lockfile",
    "sources",
    "dep:p256",
    "dep:reqwest",
    "dep:semver",
    "dep:serde_json",
]
project-write = ["dep:atomic-write-file", "dep:tempfile"]
state-write = ["dep:atomic-write-file"]
sources = [
    "dep:atomic-write-file",
    "dep:url",
]

[dependencies]
atomic-write-file = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
fs4 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
same-file.workspace = true
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
url = { workspace = true, optional = true }
xz2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
